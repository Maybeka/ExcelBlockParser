name: Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    uses: ./.github/workflows/pywebview-windows.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pywebview-windows-x64-candidate
          path: release-assets
      - name: Verify artifact identity and publish the tested bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("release-assets/build-manifest.json")); if(m.sourceCommit!==process.env.GITHUB_SHA || `v${m.version}`!==process.env.GITHUB_REF_NAME) throw new Error("Release provenance mismatch");'
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Excel Block Parser $GITHUB_REF_NAME" --generate-notes --notes 'Unsigned Windows 11 x64 pywebview single-file EXE. WebView2 is required. No separate Python installation is needed.' "${flags[@]}" release-assets/*
