name: Wails Release Candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: npm ci
      - run: npm run test:release
      - run: npm run build:vite
      - run: go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: npm run package:wails:win
        env:
          # Test-tag builds expose WebView2 DevTools (Ctrl+Shift+F12) for
          # renderer diagnostics. Stable releases keep DevTools disabled.
          WAILS_ENABLE_DEVTOOLS: ${{ contains(github.ref_name, '-') && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wails-windows-x64-release-candidate
          path: release-wails/
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path release-wails -File | ForEach-Object { $_.FullName }
          $releaseArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME
            '--verify-tag'
            '--title', "Excel Block Parser $env:GITHUB_REF_NAME"
            '--generate-notes'
            '--notes', 'Unsigned Windows 11 x64 Wails release. Verify the bundled SHA-256 checksum before use.'
          )
          if ($env:GITHUB_REF_NAME -match '-') { $releaseArgs += '--prerelease' }
          gh @releaseArgs $assets
