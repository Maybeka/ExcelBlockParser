name: Wails Release Candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22.x' }
      - run: npm ci
      - run: npm run test:release
      - run: npm run build:vite
      - run: go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: npm run package:wails:win
      - uses: actions/upload-artifact@v4
        with:
          name: wails-windows-x64-release-candidate
          path: release-wails/
          if-no-files-found: error

# This workflow intentionally does not create a GitHub release. Windows 11 ZIP
# acceptance is a v1 gate; Authenticode signing and installer distribution are
# post-v1 work.
