name: Wails Release Candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22.x' }
      - run: npm ci
      - run: go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: $(go env GOPATH)/bin/wails build
      - uses: actions/upload-artifact@v4
        with:
          name: wails-macos-release-candidate
          path: build/bin/
          if-no-files-found: error

# This workflow intentionally does not create a GitHub release. Publishing,
# signing, notarization, installer validation, and platform acceptance are M6
# gates and must be recorded before a v1 release is published.
