name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit -p tsconfig.web.json
      - run: npx tsc --noEmit -p tsconfig.node.json
      - run: npm run test:main
      - run: npm run test:release
      - run: npm run test:unit
      - run: npm test

  native-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Native Electron workflow
        run: npm run test:native
        env:
          ELECTRON_E2E_SHOW_WINDOWS: '1'
      - name: Unpacked package smoke test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-test-results-windows
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: unpacked-windows
          path: release/
          if-no-files-found: error

  wails-production-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22.x' }
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build:vite
      - run: go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: '& "$(go env GOPATH)\bin\wails.exe" build -platform windows/amd64'
      - uses: actions/upload-artifact@v4
        with:
          name: wails-windows-x64
          path: build/bin/
          if-no-files-found: error
