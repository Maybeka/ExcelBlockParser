name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit -p tsconfig.web.json
      - run: npx tsc --noEmit -p tsconfig.node.json
      - run: npm run test:main
      - run: npm run test:release
      - run: npm run test:unit
      - run: npm test

  native-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Native Electron workflow (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:native
      - name: Native Electron workflow (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:native
      - name: Unpacked package smoke test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: unpacked-${{ runner.os }}
          path: release/
          if-no-files-found: error

  wails-production-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version: '1.22.x' }
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: go test ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - run: '& "$(go env GOPATH)\bin\wails.exe" build -platform windows/amd64'
      - uses: actions/upload-artifact@v4
        with:
          name: wails-windows-x64
          path: build/bin/
          if-no-files-found: error
