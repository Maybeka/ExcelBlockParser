name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_WORKERS: '1'
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m venv .venv-pywebview
          .venv-pywebview/bin/python -m pip install -r desktop_pywebview/requirements-build.txt
      - run: npm run test:pywebview
      - run: go test ./cmd/native-helper/...
      - run: npm run test:main
      - run: npm run test:release
      - run: npm run test:unit
      - run: npm test

  native-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Native Electron workflow
        run: npm run test:native
        env:
          ELECTRON_E2E_SHOW_WINDOWS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-test-results-windows
          path: test-results/
          if-no-files-found: ignore
