name: Pywebview Windows Candidate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: Release version and artifact integrity tests
        run: npm run test:release
      - name: Install desktop runtime and packager
        run: |
          python -m venv .venv-pywebview
          .venv-pywebview/Scripts/python.exe -m pip install -r desktop_pywebview/requirements-build.txt
      - name: Host, trusted CPython and equation regressions
        run: npm run test:pywebview
      - name: Build candidate and native fixtures
        run: npm run package:pywebview
      - name: Source WebView2 native acceptance
        run: .venv-pywebview/Scripts/python.exe -m desktop_pywebview.verify_native
      - name: Downloaded single-file distribution and legacy failure control
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/Maybeka/ExcelBlockParser/releases/download/pywebview-preview-2026-10-28-nogo/CI-ONLY-legacy-startup-failure-fixture.zip' -OutFile .tmp/pywebview-previous-preview.zip
          .venv-pywebview/Scripts/python.exe -m desktop_pywebview.verify_distribution --baseline-archive .tmp/pywebview-previous-preview.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Downloaded EXE full WebView2 native acceptance
        run: .venv-pywebview/Scripts/python.exe -m desktop_pywebview.verify_native --executable ".tmp/pywebview-downloaded-distribution/Downloaded app with spaces/Excel Block Parser.exe" --logs .tmp/pywebview-packaged-native-logs
      - name: Prepare release bytes and provenance without rebuilding
        run: node scripts/prepare-pywebview-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pywebview-windows-native-logs
          path: |
            .tmp/pywebview-native-logs/
            .tmp/pywebview-packaged-native-logs/
            .tmp/pywebview-downloaded-distribution/*.log
            .tmp/pywebview-downloaded-distribution/*.result.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: pywebview-windows-x64-candidate
          path: release-pywebview/assets/
          if-no-files-found: error
